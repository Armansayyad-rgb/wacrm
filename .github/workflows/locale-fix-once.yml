name: Locale parity fix once

on:
  push:
    branches:
      - saas/commercial-foundation
    paths:
      - '.github/workflows/locale-fix-once.yml'

permissions:
  contents: write

jobs:
  fix-locales:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: saas/commercial-foundation

      - name: Add missing Portuguese and Spanish import messages
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          updates = {
              'messages/pt.json': {
                  'resultInvalidPhone': '{count} telefone inválido',
                  'resultInvalidPhone_plural': '{count} telefones inválidos',
                  'failedRowsHeading': 'Linhas com falha',
                  'unknownReason': 'Erro desconhecido',
                  'toastInvalidPhone': '{count} contato não tinha um número de telefone utilizável',
                  'toastInvalidPhone_plural': '{count} contatos não tinham um número de telefone utilizável',
              },
              'messages/es.json': {
                  'resultInvalidPhone': '{count} teléfono inválido',
                  'resultInvalidPhone_plural': '{count} teléfonos inválidos',
                  'failedRowsHeading': 'Filas con error',
                  'unknownReason': 'Error desconocido',
                  'toastInvalidPhone': '{count} contacto no tenía un número de teléfono utilizable',
                  'toastInvalidPhone_plural': '{count} contactos no tenían un número de teléfono utilizable',
              },
          }

          for filename, values in updates.items():
              path = Path(filename)
              data = json.loads(path.read_text(encoding='utf-8'))
              modal = data['Contacts']['importModal']
              modal.update(values)
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + '\n',
                  encoding='utf-8',
              )
          PY

      - name: Commit locale fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messages/pt.json messages/es.json
          git diff --cached --check
          git commit -m "fix: restore locale catalogue parity"
          git push origin HEAD:saas/commercial-foundation
